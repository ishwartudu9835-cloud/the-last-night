# Automatic Android APK build with GameCI.
# ⚠ Runs only when you start it by hand (Actions tab > "Android APK (Unity)" > Run workflow),
#   because it needs two things first — see SETUP.md, section "GitHub se automatic APK":
#   1. ProjectSettings/ + Packages/ committed (open the project in Unity once and push them)
#   2. Repo secrets: UNITY_EMAIL, UNITY_PASSWORD, UNITY_LICENSE (Unity Personal license file)
name: Android APK (Unity)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check project files
        run: |
          test -f ProjectSettings/ProjectVersion.txt || { echo "::error::ProjectSettings missing — open the project in Unity once and push ProjectSettings/ and Packages/ (SETUP.md)"; exit 1; }
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Android-
      - uses: jlumbroso/free-disk-space@v1.3.1
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          androidExportType: androidPackage
      - uses: actions/upload-artifact@v4
        with:
          name: the-last-night-apk
          path: build/Android
